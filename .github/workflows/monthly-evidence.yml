name: Sync sealed monthly evidence

on:
  schedule:
    - cron: "30 2 3 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to fetch (YYYY-MM); empty means previous month"
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify sealed snapshot
        env:
          MONTH: ${{ inputs.month || '' }}
        run: |
          if [ -n "$MONTH" ]; then
            python scripts/fetch_snapshot.py --month "$MONTH"
          else
            python scripts/fetch_snapshot.py
          fi
      - name: Commit new evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots reports
          git diff --cached --quiet || git commit -m "evidence: add sealed monthly snapshot"
          git push
